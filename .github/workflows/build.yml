name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - name: Loyiha papkasini topish (zip bo'lsa ochadi)
        run: |
          if ls *.zip >/dev/null 2>&1; then
            mkdir -p /tmp/proj
            unzip -o -q "$(ls *.zip | head -1)" -d /tmp/proj
            D=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -1)")
          else
            D=$GITHUB_WORKSPACE
          fi
          echo "PROJ=$D" >> $GITHUB_ENV
          echo "Loyiha: $D"
      - run: gradle -p "$PROJ" assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BotHost-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
